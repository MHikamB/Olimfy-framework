services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olimfy_app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: olimfy_db
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      SESSION_DRIVER: database
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: olimfy_postgres
    environment:
      POSTGRES_DB: olimfy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olimfy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
